# Docs for the Azure Web Apps Deploy action: https://github.com/azure/functions-action
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure Functions: https://aka.ms/python-webapps-actions

name: Build and deploy Python project to Azure Function App - sitedocs-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # Gate. The CI workflow runs these same tests, but a deploy must not depend
  # on another workflow having passed — the two race on a push, and a red CI
  # run would not stop this one. Running them here is the only thing that
  # actually blocks a bad deploy.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Pytest
        run: python -m pytest tests/ -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The remote (Oryx) build runs pip install on Azure — without it the app
      # ships with no dependencies and every function dies on import. With a
      # publish-profile the action ignores remote-build and only honors the
      # two scm/oryx flags below, so all three are set.
      - name: 'Deploy to Azure Functions'
        uses: Azure/functions-action@v1
        id: deploy-to-function
        with:
          app-name: 'sitedocs-api'
          slot-name: 'Production'
          package: '.'
          respect-funcignore: true
          remote-build: true
          scm-do-build-during-deployment: true
          enable-oryx-build: true
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_F99ECCE0BE3140D6B00F5FC1611658C3 }}
